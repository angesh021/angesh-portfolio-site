  <script>
    // Immediately sets theme and favicon to prevent FOUC and adapt to system theme
    (function() {
      const favicons = {
        dark: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 30,70 C 30,40 42,24 50,24 C 58,24 70,40 70,70' fill='none' stroke='%23fdfbfa' stroke-width='7.7' stroke-linecap='round' stroke-linejoin='round'/><path d='M 80,28 C 62,28 40,36 40,50 C 40,64 62,72 80,72' fill='none' stroke='%23b4ae9c' stroke-width='7.7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='30' cy='70' r='7.315' fill='%23fdfbfa'/><circle cx='70' cy='70' r='7.315' fill='%23fdfbfa'/><circle cx='80' cy='28' r='7.315' fill='%23b4ae9c'/><circle cx='80' cy='72' r='7.315' fill='%23b4ae9c'/></svg>",
        light: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 30,70 C 30,40 42,24 50,24 C 58,24 70,40 70,70' fill='none' stroke='%23232b2f' stroke-width='7.7' stroke-linecap='round' stroke-linejoin='round'/><path d='M 80,28 C 62,28 40,36 40,50 C 40,64 62,72 80,72' fill='none' stroke='%23b4ae9c' stroke-width='7.7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='30' cy='70' r='7.315' fill='%23232b2f'/><circle cx='70' cy='70' r='7.315' fill='%23232b2f'/><circle cx='80' cy='28' r='7.315' fill='%23b4ae9c'/><circle cx='80' cy='72' r='7.315' fill='%23b4ae9c'/></svg>"
      };

      function setFaviconForTheme(theme) {
        const url = favicons[theme] || favicons.dark;
        document.getElementById('favicon').setAttribute('href', url);
        document.getElementById('apple-touch-icon').setAttribute('href', url);
      }

      // Initial setup
      let theme = 'dark';
      try {
        const storedTheme = localStorage.getItem('theme');
        // If no theme is stored, respect the user's OS preference
        if (storedTheme) {
          theme = storedTheme === 'light' ? 'light' : 'dark';
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) { /* ignore */ }

      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
      setFaviconForTheme(theme);

      // Observer for runtime changes
      let lastTheme = theme;
      const observer = new MutationObserver(() => {
        const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        if (currentTheme !== lastTheme) {
          setFaviconForTheme(currentTheme);
          lastTheme = currentTheme;
        }
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    })();
  </script>

  <!-- Critical pre-paint styles to prevent unstyled layout shifts/jerks during async asset/Tailwind load -->
  <style>
    /* 1. Prevent background shifts & flashes */
    html {
      background-color: #0c1626;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      color: #8892b0;
      scrollbar-gutter: stable;
    }
    html.light {
      background-color: #f4f5f7;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
      color: #6c757d;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow-x: hidden;
      width: 100%;
    }
    
    /* 2. Lock Header menu elements to stop menu shifting/jerking */
    header {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 40 !important;
      width: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: flex-start !important;
      padding: 16px !important;
      pointer-events: none !important;
      box-sizing: border-box !important;
    }
    header nav {
      pointer-events: auto !important;
    }
    .aetherius-bar {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
      padding: 8px 12px !important;
      border-radius: 9999px !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(100, 255, 218, 0.1) !important;
      background-color: rgba(17, 34, 64, 0.5) !important;
      box-sizing: border-box !important;
      height: 48px !important;
    }
    html.light .aetherius-bar {
      background-color: rgba(255, 255, 255, 0.8) !important;
      border: 1px solid #dee2e6 !important;
    }

    /* 3. Hero layout - prevent columns ordering jumping on desktop */
    #hero {
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 100vh !important;
      padding: 96px 24px 128px 24px !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }
    #hero .grid {
      display: grid !important;
      grid-template-columns: 1fr !important;
      gap: 2rem !important;
      width: 100% !important;
      max-width: 1280px !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    @media (min-width: 768px) {
      #hero .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
        gap: 4rem !important;
        align-items: start !important;
      }
      /* Match JSX: Left column is 2nd in DOM but displayed 1st (col-span-3) */
      #hero .grid > div:nth-child(2) {
        grid-column: span 3 / span 3 !important;
        order: -1 !important;
      }
      /* Match JSX: Right column is 1st in DOM but displayed 2nd (col-span-2) */
      #hero .grid > div:first-child {
        grid-column: span 2 / span 2 !important;
        order: 1 !important;
      }
    }

    /* 4. Profile Photo sizing & container locking (absolutely critical to block gigantic native image flashing) */
    .hud-container-parent {
      position: relative !important;
      width: 310px !important;
      height: 350px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    @media (min-width: 640px) {
      .hud-container-parent {
        width: 340px !important;
        height: 380px !important;
      }
    }
    @media (min-width: 768px) {
      .hud-container-parent {
        width: 420px !important;
        height: 480px !important;
      }
    }
    @media (min-width: 1024px) {
      .hud-container-parent {
        width: 480px !important;
        height: 550px !important;
      }
    }

    .hud-container {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    .hex-clip {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%) !important;
      -webkit-clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%) !important;
    }
    .hud-container img {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* 5. Decompiling Text container reservation */
    .decompiling-text-container {
      min-height: 120px !important;
    }
    @media (min-width: 640px) {
      .decompiling-text-container {
        min-height: 160px !important;
      }
    }
    @media (min-width: 768px) {
      .decompiling-text-container {
        min-height: 230px !important;
      }
    }
    @media (min-width: 1024px) {
      .decompiling-text-container {
        min-height: 250px !important;
      }
    }
  </style>
